image melkor-esp.vfat {
    vfat {
        files = { "EFI" }
    }
    size = 64M
}

image melkor-m1.img {
    hdimage {
        partition-table-type = "gpt"
        align = 1M
    }

    partition esp {
        image = "melkor-esp.vfat"
        partition-type-uuid = U
        partition-uuid = "9327fc8b-81c1-4a28-85d1-926f223636f7"
    }

    partition core-a {
        image = "rootfs.squashfs"
        partition-type-uuid = L
        partition-uuid = "5ec75b1f-b914-4890-b5c9-da50d53bf535"
        size = 128M
    }

    partition core-b {
        image = "rootfs.squashfs"
        partition-type-uuid = L
        partition-uuid = "0c7a09b8-0232-493b-a079-e966c61f06f0"
        size = 128M
    }

    partition persist {
        image = "persist.ext4"
        partition-type-uuid = L
    }
}
