serial --unit=0 --speed=115200
terminal_input serial
terminal_output serial

set default=slot-a
set timeout=3
set melkor_esp=$root
set melkor_env="($melkor_esp)/EFI/BOOT/grubenv"
set ORDER="A B"
set A_OK=1
set A_TRY=0
set B_OK=0
set B_TRY=0
load_env -f "$melkor_env" ORDER A_OK A_TRY B_OK B_TRY

# RAUC marca a geração em teste e o primeiro boot consome sua tentativa.
set melkor_ready=no
for slot in $ORDER; do
    if [ "$slot" = A -a "$A_OK" = 1 -a "$A_TRY" = 0 ]; then
        set default=slot-a
        set melkor_ready=yes
        break
    fi
    if [ "$slot" = B -a "$B_OK" = 1 -a "$B_TRY" = 0 ]; then
        set default=slot-b
        set melkor_ready=yes
        break
    fi
done
if [ "$melkor_ready" = no ]; then
    set timeout=-1
fi

function melkor_boot {
    if [ "$3" = A ]; then
        set A_TRY=1
        set melkor_attempt=A_TRY
    else
        set B_TRY=1
        set melkor_attempt=B_TRY
    fi
    if save_env -f "$melkor_env" "$melkor_attempt"; then
        if regexp --set=1:melkor_disk '^([^,]+),gpt1$' "$melkor_esp"; then
            linux "($melkor_disk,gpt$1)/boot/bzImage" "root=PARTUUID=$2" rootfstype=squashfs rootwait ro console=ttyS0,115200n8 init=/sbin/dinit "rauc.slot=$3"
        else
            echo 'Nao foi possivel identificar o disco GPT do Melkor.'
        fi
    else
        echo 'Nao foi possivel gravar a tentativa no grubenv.'
    fi
}

menuentry 'Melkor Linux M1 - slot A' --id slot-a {
    melkor_boot 2 5ec75b1f-b914-4890-b5c9-da50d53bf535 A
}

menuentry 'Melkor Linux M1 - slot B' --id slot-b {
    melkor_boot 3 0c7a09b8-0232-493b-a079-e966c61f06f0 B
}
