image esp.vfat {
    vfat {
        files = { "EFI", "bzImage" }
    }
    mountpoint = "/"
    size = 64M
}

image melkor-m0.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition esp {
        image = "esp.vfat"
        partition-type-uuid = U
        offset = 1M
    }

    partition rootfs {
        image = "rootfs.squashfs"
        partition-type-uuid = L
        partition-uuid = "c5481239-18ae-4c0e-8399-85e7255b04f9"
        align = 1M
    }
}
