image melkor-live-esp.vfat {
    vfat {
        files = { "EFI", "bzImage", "rootfs.cpio.gz" }
        label = "MELKOR_LIVE"
        extraargs = "-F 32"
    }
    size = 64M
}

image melkor-live-eltorito.vfat {
    vfat {
        files = { "EFI", "bzImage", "rootfs.cpio.gz" }
        extraargs = "-F 16"
    }
    # O tamanho do boot image em blocos de 512 bytes precisa caber em 16 bits.
    size = 30M
}

image melkor-live.img {
    hdimage {
        partition-table-type = "gpt"
        align = 1M
    }

    partition esp {
        image = "melkor-live-esp.vfat"
        partition-type-uuid = U
    }
}
