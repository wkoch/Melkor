image melkor-live-esp.vfat {
    vfat {
        files = { "EFI", "bzImage", "rootfs.cpio.gz" }
        label = "MELKOR_LIVE"
        extraargs = "-F 32"
    }
    size = 64M
}

image melkor-live.img {
    hdimage {
        partition-table-type = "gpt"
        align = 1M
    }

    partition esp {
        image = "melkor-live-esp.vfat"
        partition-type-uuid = U
    }
}
