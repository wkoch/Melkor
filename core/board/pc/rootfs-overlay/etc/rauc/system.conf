[system]
compatible=melkor-pc-limine-x86_64
bootloader=custom
data-directory=/persist/rauc
mountprefix=/run/rauc
bundle-formats=verity
perform-pre-check=true

[handlers]
bootloader-custom-backend=/usr/bin/melkor-boot

[keyring]
path=/etc/rauc/keyring.pem

[slot.rootfs.0]
device=/run/melkor/core-a
type=raw
bootname=A

[slot.rootfs.1]
device=/run/melkor/core-b
type=raw
bootname=B
