<!doctype html>
<html lang="pt-BR" data-type="software">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Melkor Linux é uma distribuição opinativa para PCs x86‑64. Baixe o PC Core e molde o sistema do seu jeito.">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="theme-color" content="#151019">
  <title>Melkor Linux</title>
  <link rel="stylesheet" href="melkor.css">
  <script src="harpa.js" defer></script>
</head>
<body>
  <main class="hero">
    <div class="story" data-enter>
      <h1>Melkor Linux</h1>
      <p class="verse">Melkor acrescenta sua voz à canção da criação. Assim molda o mundo em que irá viver.</p>
      <p class="description">Uma distro Linux opinativa para x86‑64.<br>
        O core do Melkor.<br>
        Sua voz molda o sistema.</p>
      <nav aria-label="Links do projeto">
        <a class="download" id="baixar-core" href="https://github.com/wkoch/Melkor/releases/tag/pc-v0.1.0-alpha.6-desktop">Baixar Core</a>
        <a href="https://github.com/wkoch/Melkor/blob/main/docs/INSTALACAO.md">Guia de instalação</a>
        <a href="https://github.com/wkoch/Melkor">Código no GitHub</a>
      </nav>
    </div>
    <div class="scene">
      <div class="plate">
        <img src="harpa-das-montanhas.webp" width="1672" height="941" fetchpriority="high"
             alt="Gravura de Melkor, um guaxinim de lenço vermelho, tocando uma harpa cujas cordas se transformam em montanhas.">
        <canvas class="resonance" width="1672" height="941" aria-hidden="true"></canvas>
      </div>
    </div>
    <p class="status" role="status"></p>
  </main>
  <script>
    // Aponta "Baixar Core" para a release pc-v* mais recente publicada no GitHub.
    // Releases em pré-lançamento entram na conta; /releases/latest não serve aqui,
    // porque ignora pré-lançamentos. Sem JavaScript ou sem rede, fica o link de fallback acima.
    (function () {
      var link = document.getElementById("baixar-core");
      if (!link || !window.fetch) return;
      fetch("https://api.github.com/repos/wkoch/Melkor/releases?per_page=30", {
        headers: { Accept: "application/vnd.github+json" }
      })
        .then(function (response) {
          if (!response.ok) throw new Error("GitHub respondeu " + response.status);
          return response.json();
        })
        .then(function (releases) {
          var newest = releases
            .filter(function (release) { return !release.draft && /^pc-v/.test(release.tag_name); })
            .sort(function (a, b) { return new Date(b.published_at) - new Date(a.published_at); })[0];
          if (newest && newest.html_url) link.href = newest.html_url;
        })
        .catch(function () { /* mantém o link de fallback */ });
    })();
  </script>
</body>
</html>
